<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Budget Famiglia - Bank authorisation</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.5rem; }
  textarea { width: 100%; font: 14px/1.4 monospace; padding: .5rem; box-sizing: border-box; }
  button { font: inherit; padding: .5rem 1rem; margin-top: .5rem; }
  .err { color: #b00020; }
</style>
</head>
<body>
<h1>Budget Famiglia - Bank authorisation / Autorizzazione bancaria</h1>
<p id="msg"></p>
<textarea id="out" rows="4" readonly hidden></textarea>
<button id="copy" hidden>Copy / Copia</button>
<p><small>This page only displays the authorisation response of your bank on your own screen; nothing is sent or stored anywhere.<br>
Questa pagina mostra soltanto sul tuo schermo la risposta della banca; nulla viene inviato o salvato.</small></p>
<script>
  var q = new URLSearchParams(location.search), msg = document.getElementById('msg'), out = document.getElementById('out'), btn = document.getElementById('copy');
  if (q.get('code')) {
    msg.textContent = 'Authorisation received. Copy the text below and paste it into the terminal. / Autorizzazione ricevuta: copia il testo qui sotto e incollalo nel terminale.';
    out.value = location.href; out.hidden = false; btn.hidden = false;
    btn.onclick = function () { out.select(); try { document.execCommand('copy'); btn.textContent = 'Copied / Copiato'; } catch (e) {} };
  } else if (q.get('error')) {
    msg.className = 'err'; msg.textContent = 'Authorisation not completed: ' + q.get('error') + (q.get('error_description') ? ' - ' + q.get('error_description') : '');
  } else {
    msg.textContent = 'Nothing to show: open this page only through the bank authorisation. / Niente da mostrare: questa pagina si apre solo dall\'autorizzazione della banca.';
  }
</script>
</body>
</html>
